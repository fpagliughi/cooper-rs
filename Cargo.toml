[package]
name = "cooper"
version = "0.3.0-pre.0"
authors = ["Frank Pagliughi <fpagliughi@mindspring.com>"]
repository = "https://github.com/fpagliughi/cooper-rs"
homepage = "https://github.com/fpagliughi/cooper-rs"
license = "MIT"
edition = "2024"
rust-version = "1.86"
readme = "README.md"
keywords = ["actors", "futures"]
categories = ["asynchronous", "concurrency"]
description = """
A simple, in-process, async Actor library for Rust.
"""

[features]
default = ["tokio"]
smol = ["dep:smol"]
tokio = ["dep:tokio"]
threaded = ["crossbeam-channel"]

[dependencies]
futures = "0.3"
async-channel = "2.3"
crossbeam-channel = { version = "0.5", optional = true }
smol = { version = "2.0", optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"

[[example]]
name = "tokio_runtime"
required-features = ["tokio"]

[[example]]
name = "threaded_keyval"
required-features = ["threaded"]

